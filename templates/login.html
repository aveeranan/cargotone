<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CargoTone CRM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
    .login-card { background: #fff; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,.1); }
    .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 28px; }
    .logo i { color: #3b82f6; font-size: 2rem; }
    .logo span { font-size: 1.5rem; font-weight: 700; color: #1a2332; }
    .form-label { font-weight: 600; font-size: .875rem; color: #374151; }
    .btn-primary { background: #3b82f6; border-color: #3b82f6; }
    .btn-primary:hover { background: #2563eb; border-color: #2563eb; }
    .footer-text { text-align: center; color: #94a3b8; font-size: .78rem; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <i class="fas fa-ship"></i>
      <span>CargoTone</span>
    </div>
    <p class="text-center text-muted mb-4" style="font-size:.9rem">Internal CRM — sign in to continue</p>

    {% if error %}
    <div class="alert alert-danger py-2 mb-3">
      <i class="fas fa-circle-exclamation me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@cargotone.com" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-lock"></i></span>
          <input type="password" name="password" id="pwd" class="form-control" placeholder="••••••••" required>
          <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()"><i class="fas fa-eye" id="eye"></i></button>
        </div>
      </div>
      <button class="btn btn-primary w-100 py-2" type="submit">
        <i class="fas fa-right-to-bracket me-2"></i>Sign In
      </button>
    </form>

    <p class="footer-text">CargoTone &copy; {{ 2025 }}</p>
  </div>

  <script>
    function togglePwd() {
      const f = document.getElementById('pwd');
      const e = document.getElementById('eye');
      f.type = f.type === 'password' ? 'text' : 'password';
      e.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }
  </script>
</body>
</html>
